info:
  contact: {}
paths:
  /clinical_notes:
    get:
      description: Retrieve a list of all clinical_notes in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.ClinicalResponseNoteDTO'
            type: array
      summary: List all clinical_notes
      tags:
      - clinical_notes
    post:
      consumes:
      - application/json
      description: Adds a new clinical_note to the system
      parameters:
      - description: ClinicalNote data
        in: body
        name: clinical_note
        required: true
        schema:
          $ref: '#/definitions/request.CreateClinicalNoteDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.ClinicalResponseNoteDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new clinical_note
